name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
permissions:
  contents: write
jobs:
  build-appimage:
    name: Build (Linux, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y build-essential rsync wget libgl1-mesa-dev
          
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.0
          dir: ..
          # Removed qt5compat to strip legacy dependencies
          modules: qtshadertools qtdeclarative
          setup-python: false
          cache: true
          
      - name: Build KDSingleApplication (Qt6)
        run: |
          # Use the ssX fork logic
          cd kdsapp 2>/dev/null || cd src/kdsapp
          qmake . 
          make -j$(nproc)
          sudo make install
          
      - name: Build qmltermwidget (Qt6)
        run: |
          cd qmltermwidget 2>/dev/null || cd src/qmltermwidget
          # Ensure qmake is picking up the Qt6 environment
          qmake .
          make -j$(nproc)
          sudo make install
          
      - name: Build ssX-cool-retro-term
        run: |
          # Build main app with link to updated libs
          qmake .
          make -j$(nproc)
          ./scripts/build-appimage.sh
          
      - name: Collect artifact
        run: |
          mkdir -p release
          mv ./*.AppImage release/
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssX-cool-retro-term-appimage
          path: ./release/*
